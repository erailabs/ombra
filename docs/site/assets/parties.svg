<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><rect width="1400" height="760" rx="24" fill="#FFFFFF"/><rect x="30" y="30" width="380" height="700" rx="20" fill="#F1EFFE"/><text x="54" y="65" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#5B4CF5" text-anchor="start">CLIENT</text><text x="386" y="65" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6B6880" text-anchor="end">trusted</text><text x="54" y="104" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="800" fill="#5B4CF5" text-anchor="start">HOLDS</text><rect x="54" y="114" width="332" height="104" rx="10" fill="#FFFFFF" stroke="#BDB7FC" stroke-width="2"/><text x="70" y="140" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1E1B3A" text-anchor="start">Secret keys</text><text x="70" y="161" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6B6880" text-anchor="start">secret key and document master key,</text><text x="70" y="179" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6B6880" text-anchor="start">in a passphrase protected key file,</text><text x="70" y="197" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6B6880" text-anchor="start">never sent anywhere</text><text x="54" y="262" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="800" fill="#5B4CF5" text-anchor="start">SEES IN PLAINTEXT</text><rect x="54" y="272" width="332" height="86" rx="10" fill="#FFFFFF" stroke="#BDB7FC" stroke-width="2"/><text x="70" y="298" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1E1B3A" text-anchor="start">Your data</text><text x="70" y="319" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6B6880" text-anchor="start">vectors, queries, documents,</text><text x="70" y="337" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6B6880" text-anchor="start">filter values and scores</text><rect x="54" y="370" width="332" height="86" rx="10" fill="#FFFFFF" stroke="#BDB7FC" stroke-width="2"/><text x="70" y="396" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1E1B3A" text-anchor="start">Cluster statistics</text><text x="70" y="417" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6B6880" text-anchor="start">kept by the client, stored</text><text x="70" y="435" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6B6880" text-anchor="start">sealed on the server</text><text x="54" y="500" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="800" fill="#5B4CF5" text-anchor="start">DOES</text><rect x="54" y="510" width="332" height="62" rx="10" fill="#5B4CF5"/><text x="70" y="536" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">Encrypts and seals</text><text x="70" y="557" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#BDB7FC" text-anchor="start">everything before it leaves</text><rect x="54" y="584" width="332" height="62" rx="10" fill="#5B4CF5"/><text x="70" y="610" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">Decrypts and opens</text><text x="70" y="631" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#BDB7FC" text-anchor="start">scores and blobs that come back</text><circle cx="347.5" cy="139.0" r="6.6" fill="none" stroke="#8C82FA" stroke-width="3.5999999999999996"/><path d="M354.1,139.0 H370 M364.0,139.0 v6.0 M368.5,139.0 v4.8" stroke="#8C82FA" stroke-width="3.5999999999999996" fill="none" stroke-linecap="round"/><rect x="590" y="30" width="780" height="420" rx="20" fill="#5B4CF5"/><text x="614" y="65" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#BDB7FC" text-anchor="start">SERVER</text><text x="1346" y="65" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#BDB7FC" text-anchor="end">untrusted</text><rect x="614" y="90" width="250" height="336" rx="14" fill="#4A3CE0"/><rect x="714.2" y="160.4" width="4.8" height="99.2" rx="2.4" fill="#FFFFFF" opacity=".6"/><rect y="185.2" x="689.4" height="4.8" width="99.2" rx="2.4" fill="#FFFFFF" opacity=".6"/><rect x="730.2" y="160.4" width="4.8" height="99.2" rx="2.4" fill="#FFFFFF" opacity=".6"/><rect y="201.2" x="689.4" height="4.8" width="99.2" rx="2.4" fill="#FFFFFF" opacity=".6"/><rect x="746.2" y="160.4" width="4.8" height="99.2" rx="2.4" fill="#FFFFFF" opacity=".6"/><rect y="217.2" x="689.4" height="4.8" width="99.2" rx="2.4" fill="#FFFFFF" opacity=".6"/><rect x="699" y="170" width="80" height="80" rx="11.200000000000001" fill="#5B4CF5" stroke="#FFFFFF" stroke-width="4.0"/><text x="739.0" y="218.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="22.400000000000002" font-weight="700" fill="#FFFFFF" text-anchor="middle">GPU</text><text x="739" y="320" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Encrypted search engine</text><text x="739" y="344" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#BDB7FC" text-anchor="middle">GPU or CPU</text><text x="739" y="380" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#BDB7FC" text-anchor="middle">computes on ciphertexts,</text><text x="739" y="398" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#BDB7FC" text-anchor="middle">cannot decrypt</text><rect x="904" y="90" width="442" height="70" rx="10" fill="#4A3CE0"/><text x="920" y="116" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">Evaluation keys and crypto context</text><text x="920" y="137" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#BDB7FC" text-anchor="start">let the server compute, not decrypt</text><rect x="904" y="172" width="442" height="70" rx="10" fill="#4A3CE0"/><text x="920" y="198" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">Encrypted vector blocks</text><text x="920" y="219" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#BDB7FC" text-anchor="start">and encrypted cluster centers</text><rect x="1250" y="188" width="14.76" height="14.76" rx="3.2399999999999998" fill="#8C82FA"/><rect x="1250" y="206" width="14.76" height="14.76" rx="3.2399999999999998" fill="#BDB7FC"/><rect x="1268" y="188" width="14.76" height="14.76" rx="3.2399999999999998" fill="#8C82FA"/><rect x="1268" y="206" width="14.76" height="14.76" rx="3.2399999999999998" fill="#FFFFFF"/><rect x="1286" y="188" width="14.76" height="14.76" rx="3.2399999999999998" fill="#BDB7FC"/><rect x="1286" y="206" width="14.76" height="14.76" rx="3.2399999999999998" fill="#BDB7FC"/><rect x="1304" y="188" width="14.76" height="14.76" rx="3.2399999999999998" fill="#8C82FA"/><rect x="1304" y="206" width="14.76" height="14.76" rx="3.2399999999999998" fill="#8C82FA"/><rect x="1322" y="188" width="14.76" height="14.76" rx="3.2399999999999998" fill="#8C82FA"/><rect x="1322" y="206" width="14.76" height="14.76" rx="3.2399999999999998" fill="#8C82FA"/><rect x="904" y="254" width="442" height="110" rx="10" fill="#BDB7FC"/><text x="920" y="280" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1E1B3A" text-anchor="start">Plaintext layout</text><text x="920" y="301" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#3F3A66" text-anchor="start">vector ids, the cluster of each vector,</text><text x="920" y="319" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#3F3A66" text-anchor="start">tombstones, collection layout</text><rect x="1220" y="266" width="112" height="24" rx="12" fill="#5B4CF5"/><text x="1276" y="283" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">server can read</text><line x1="870" y1="207" x2="892.0" y2="207.0" stroke="#FFFFFF" stroke-width="3"  stroke-linecap="round"/><polygon points="900,207 889.1946347717678,212.21958640933477 889.1946347717678,201.78041359066523" fill="#FFFFFF"/><text x="1000" y="400" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#BDB7FC" text-anchor="middle">Everything else</text><text x="1000" y="418" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#BDB7FC" text-anchor="middle">is encrypted.</text><rect x="590" y="490" width="780" height="240" rx="20" fill="#8C82FA"/><text x="614" y="525" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="start">SERVER STORAGE</text><text x="1346" y="525" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#F1EFFE" text-anchor="end">untrusted</text><rect x="614" y="545" width="530" height="80" rx="10" fill="#FFFFFF" stroke="#BDB7FC" stroke-width="2"/><text x="630" y="571" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1E1B3A" text-anchor="start">Sealed record and document blobs</text><text x="630" y="592" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6B6880" text-anchor="start">AES-256-GCM, padded to fixed size buckets</text><rect x="614" y="640" width="530" height="70" rx="10" fill="#FFFFFF" stroke="#BDB7FC" stroke-width="2"/><text x="630" y="666" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1E1B3A" text-anchor="start">Catalog and segment files</text><text x="630" y="687" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6B6880" text-anchor="start">encrypted blocks plus the plaintext layout</text><path d="M1213.2,588.8 v-8.4 a16.8,16.8 0 0 1 33.6,0 v8.4" fill="none" stroke="#FFFFFF" stroke-width="6.6"/><rect x="1200" y="587.0" width="60" height="33.0" rx="7.199999999999999" fill="#FFFFFF"/><line x1="412" y1="210" x2="578.0" y2="210.0" stroke="#5B4CF5" stroke-width="3"  stroke-linecap="round"/><polygon points="586,210 575.1946347717678,215.21958640933477 575.1946347717678,204.78041359066523" fill="#5B4CF5"/><text x="500" y="196" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6B6880" text-anchor="middle">ciphertexts,</text><text x="500" y="236" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6B6880" text-anchor="middle">eval keys, ids</text><line x1="586" y1="300" x2="420.0" y2="300.0" stroke="#8C82FA" stroke-width="3"  stroke-linecap="round"/><polygon points="412,300 422.8053652282321,294.78041359066526 422.8053652282321,305.21958640933474" fill="#8C82FA"/><text x="500" y="325" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6B6880" text-anchor="middle">encrypted scores</text><line x1="412" y1="585" x2="578.0" y2="585.0" stroke="#5B4CF5" stroke-width="3"  stroke-linecap="round"/><polygon points="586,585 575.1946347717678,590.2195864093347 575.1946347717678,579.7804135906653" fill="#5B4CF5"/><text x="500" y="571" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6B6880" text-anchor="middle">sealed blobs</text><line x1="586" y1="640" x2="420.0" y2="640.0" stroke="#8C82FA" stroke-width="3"  stroke-linecap="round"/><polygon points="412,640 422.8053652282321,634.7804135906653 422.8053652282321,645.2195864093347" fill="#8C82FA"/><text x="500" y="665" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6B6880" text-anchor="middle">sealed blobs</text><line x1="1125" y1="366" x2="1125.0" y2="478.0" stroke="#8C82FA" stroke-width="3"  stroke-linecap="round"/><polygon points="1125,486 1119.7804135906651,475.1946347717679 1130.2195864093349,475.1946347717679" fill="#8C82FA"/><text x="1140" y="474" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#6B6880" text-anchor="start">saved to disk</text></svg>