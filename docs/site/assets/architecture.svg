never sent</text><rect x="70" y="368" width="300" height="52" rx="9" fill="#FFFFFF" stroke="#BDB7FC" stroke-width="2"/><circle cx="338.0" cy="396.0" r="5.28" fill="none" stroke="#8C82FA" stroke-width="2.88"/><path d="M343.28,396.0 H356 M351.2,396.0 v4.800000000000001 M354.8,396.0 v3.84" stroke="#8C82FA" stroke-width="2.88" fill="none" stroke-linecap="round"/><text x="86" y="390" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1E1B3A" text-anchor="start">Record key</text><text x="86" y="409" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#6B6880" text-anchor="start">AES-GCM key for your documents</text><text x="74" y="446" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="800" fill="#5B4CF5" text-anchor="start">DOES</text><rect x="70" y="456" width="300" height="52" rx="9" fill="#5B4CF5"/><text x="86" y="478" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">Cluster (setup)</text><text x="86" y="497" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#BDB7FC" text-anchor="start">k-means groups similar vectors</text><rect x="70" y="516" width="300" height="52" rx="9" fill="#5B4CF5"/><text x="86" y="538" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">Encrypt</text><text x="86" y="557" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#BDB7FC" text-anchor="start">CKKS via OpenFHE, 128-bit</text><circle cx="348" cy="542" r="15" fill="#FFFFFF"/><text x="348" y="548" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#5B4CF5" text-anchor="middle">1</text><rect x="70" y="576" width="300" height="52" rx="9" fill="#5B4CF5"/><text x="86" y="598" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">Decrypt and pick</text><text x="86" y="617" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#BDB7FC" text-anchor="start">choose clusters, keep best candidates</text><circle cx="348" cy="602" r="15" fill="#FFFFFF"/><text x="348" y="608" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#5B4CF5" text-anchor="middle">4</text><rect x="70" y="636" width="300" height="52" rx="9" fill="#5B4CF5"/><text x="86" y="658" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">Re-rank</text><text x="86" y="677" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#BDB7FC" text-anchor="start">exact scores on decrypted records</text><circle cx="348" cy="662" r="15" fill="#FFFFFF"/><text x="348" y="668" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#5B4CF5" text-anchor="middle">7</text><rect x="430" y="300" width="150" height="130" rx="12" fill="#FFFFFF" stroke="#8C82FA" stroke-width="2" stroke-dasharray="6 6"/><text x="505" y="330" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#5B4CF5" text-anchor="middle">gRPC + TLS</text><text x="505" y="355" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6B6880" text-anchor="middle">ciphertexts and</text><text x="505" y="372" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6B6880" text-anchor="middle">public evaluation</text><text x="505" y="389" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6B6880" text-anchor="middle">keys only<