erif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">Router</text><ellipse cx="685" cy="628" rx="62" ry="22" fill="#4A3CE0"/><rect x="623" y="596" width="124" height="32" fill="#4A3CE0"/><ellipse cx="685" cy="596" rx="62" ry="22" fill="#FFFFFF"/><line x1="639" y1="588" x2="668.0" y2="588.0" stroke="#5B4CF5" stroke-width="4" stroke-linecap="round"/><polygon points="673,588 666.3973150807226,592.5171397871603 666.3973150807226,583.4828602128397" fill="#5B4CF5"/><line x1="673" y1="604" x2="644.0" y2="604.0" stroke="#5B4CF5" stroke-width="4" stroke-linecap="round"/><polygon points="639,604 645.6026849192774,599.4828602128397 645.6026849192774,608.5171397871603" fill="#5B4CF5"/><line x1="697" y1="588" x2="726.0" y2="588.0" stroke="#5B4CF5" stroke-width="4" stroke-linecap="round"/><polygon points="731,588 724.3973150807226,592.5171397871603 724.3973150807226,583.4828602128397" fill="#5B4CF5"/><line x1="731" y1="604" x2="702.0" y2="604.0" stroke="#5B4CF5" stroke-width="4" stroke-linecap="round"/><polygon points="697,604 703.6026849192774,599.4828602128397 703.6026849192774,608.5171397871603" fill="#5B4CF5"/><line x1="772" y1="520" x2="800.0" y2="520.0" stroke="#5B4CF5" stroke-width="3"  stroke-linecap="round"/><polygon points="808,520 797.1946347717678,525.2195864093347 797.1946347717678,514.7804135906653" fill="#5B4CF5"/><line x1="772" y1="660" x2="800.0" y2="660.0" stroke="#8C82FA" stroke-width="2.5" stroke-dasharray="6 7" stroke-linecap="round"/><polygon points="808,660 797.1946347717678,665.2195864093347 797.1946347717678,654.7804135906653" fill="#8C82FA"/><line x1="772" y1="705" x2="801.854229763221" y2="729.8785248026842" stroke="#8C82FA" stroke-width="2.5" stroke-dasharray="6 7" stroke-linecap="round"/><polygon points="808,735 796.3575907058937,732.092371098557 803.0405862898074,724.0727763978606" fill="#8C82FA"/><rect x="810" y="110" width="560" height="500" rx="20" fill="#5B4CF5"/><text x="834" y="145" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#BDB7FC" text-anchor="start">NODE 1</text><text x="1346" y="145" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#BDB7FC" text-anchor="end">sees only ciphertexts</text><rect x="834" y="160" width="512" height="58" rx="10" fill="#4A3CE0"/><text x="848" y="184" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">gRPC API</text><text x="848" y="205" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#BDB7FC" text-anchor="start">search rounds, inserts and blobs, auth by API key, one GPU per node</text><rect x="834" y="232" width="512" height="236" rx="14" fill="#4A3CE0"/><rect x="1303.6999999999998" y="242.4" width="1.7999999999999998" height="37.2" rx="0.8999999999999999" fill="#FFFFFF" opacity=".6"/><rect y="251.7" x="1294.4" height="1.7999999999999998" width="37.2" rx="0.8999999999999999" fill="#FFFFFF" opacity=".6"/><rect x="1309.6999999999998" y="242.4" width="1.7999999999999998" height="37.2" rx="0.8999999999999999" fill="#FFFFFF" opacity=".6"/><rect y="257.70000000000005" x="1294.4" height="1.7999999999999998" width="37.2" rx="0.8999999999999999" fill="#FFFFFF" opacity=".6"/><rect x="1315.6999999999998" y="242.4" width="1.7999999999999998" height="37.2" rx="0.8999999999999999" fill="#FFFFFF" opacity=".6"/><rect y="263.70000000000005" x="1294.4" height="1.7999999999999998" width="37.2" rx="0.8999999999999999" fill="#FFFFFF" opacity=".6"/><rect x="1298" y="246" width="30" height="30" rx="4.2" fill="#5B4CF5" stroke="#FFFFFF" stroke-width="1.5"/><text x="1313.0" y="264.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="8.4" font-weight="700" fill="#FFFFFF" text-anchor="middle">GPU</text><text x="852" y="262" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="start">GPU search pipeline</text><rect x="852" y="282" width="476" height="50" rx="9" fill="#FFFFFF"/><circle cx="875" cy="307" r="15" fill="#5B4CF5"/><text x="875" y="313" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="900" y="303" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1E1B3A" text-anchor="start">Expand the query</text><text x="900" y="322" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#6B6880" text-anchor="start">automorphisms, uses no multiplication level</text><rect x="852" y="342" width="476" height="50" rx="9" fill="#FFFFFF"/><circle cx="875" cy="367" r="15" fill="#5B4CF5"/><text x="875" y="373" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="900" y="363" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1E1B3A" text-anchor="start">Score cluster centers</text><text x="900" y="382" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#6B6880" text-anchor="start">one encrypted score per center</text><rect x="852" y="402" width="476" height="50" rx="9" fill="#FFFFFF"/><circle cx="875" cy="427" r="15" fill="#5B4CF5"/><text x="875" y="433" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="900" y="423" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1E1B3A" text-anchor="start">Score chosen clusters</text><text x="900" y="442" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#6B6880" text-anchor="start">thousands of vectors per ciphertext, filters added as a penalty</text><rect x="834" y="480" width="248" height="58" rx="10" fill="#4A3CE0"/><text x="848" y="504" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">GPU cluster cache</text><text x="848" y="525" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#BDB7FC" text-anchor="start">hot clusters stay in VRAM</text><rect x="1098" y="480" width="248" height="58" rx="10" fill="#4A3CE0"/><text x="1112" y="504" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">Storage</text><text x="1112" y="525" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#BDB7FC" text-anchor="start">segments, WAL, catalog, records</text><rect x="834" y="546" width="512" height="54" rx="10" fill="#4A3CE0"/><text x="848" y="570" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">REST API</text><text x="848" y="591" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#BDB7FC" text-anchor="start">health for load balancers, metrics for monitoring, admin for collections</text><circle cx="1324" cy="500" r="15" fill="#5B4CF5"/><text x="1324" y="506" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><rect x="810" y="630" width="560" height="60" rx="16" fill="#7A6EF7"/><text x="834" y="666" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="start">NODE 2</text><rect x="810" y="705" width="560" height="60" rx="16" fill="#BDB7FC"/><text x="834" y="741" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#5B4CF5" text-anchor="start">NODE N</text><rect x="30" y="790" width="1340" height="120" rx="20" fill="#F1EFFE"/><text x="54" y="822" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#5B4CF5" text-anchor="start">SEARCH WORKFLOW</text><rect x="54" y="838" width="172" height="56" rx="10" fill="#FFFFFF" stroke="#BDB7FC" stroke-width="2"/><circle cx="76" cy="866" r="15" fill="#5B4CF5"/><text x="76" y="872" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="98" y="871" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1E1B3A" text-anchor="start">Encrypt query</text><polygon points="230,860 238,866 230,872" fill="#8C82FA"/><rect x="242" y="838" width="172" height="56" rx="10" fill="#5B4CF5"/><circle cx="264" cy="866" r="15" fill="#FFFFFF"/><text x="264" y="872" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#5B4CF5" text-anchor="middle">2</text><text x="286" y="871" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">Expand on GPU</text><polygon points="418,860 426,866 418,872" fill="#8C82FA"/><rect x="430" y="838" width="172" height="56" rx="10" fill="#5B4CF5"/><circle cx="452" cy="866" r="15" fill="#FFFFFF"/><text x="452" y="872" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#5B4CF5" text-anchor="middle">3</text><text x="474" y="871" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">Score centers</text><polygon points="606,860 614,866 606,872" fill="#8C82FA"/><rect x="618" y="838" width="172" height="56" rx="10" fill="#FFFFFF" stroke="#BDB7FC" stroke-width="2"/><circle cx="640" cy="866" r="15" fill="#5B4CF5"/><text x="640" y="872" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="662" y="871" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1E1B3A" text-anchor="start">Pick clusters</text><polygon points="794,860 802,866 794,872" fill="#8C82FA"/><rect x="806" y="838" width="172" height="56" rx="10" fill="#5B4CF5"/><circle cx="828" cy="866" r="15" fill="#FFFFFF"/><text x="828" y="872" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#5B4CF5" text-anchor="middle">5</text><text x="850" y="871" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">Score clusters</text><polygon points="982,860 990,866 982,872" fill="#8C82FA"/><rect x="994" y="838" width="172" height="56" rx="10" fill="#5B4CF5"/><circle cx="1016" cy="866" r="15" fill="#FFFFFF"/><text x="1016" y="872" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#5B4CF5" text-anchor="middle">6</text><text x="1038" y="871" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">Fetch records</text><polygon points="1170,860 1178,866 1170,872" fill="#8C82FA"/><rect x="1182" y="838" width="172" height="56" rx="10" fill="#FFFFFF" stroke="#BDB7FC" stroke-width="2"/><circle cx="1204" cy="866" r="15" fill="#5B4CF5"/><text x="1204" y="872" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text><text x="1226" y="871" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1E1B3A" text-anchor="start">Re-rank</text></g></svg>