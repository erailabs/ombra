[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "llama-index-vector-stores-ombra"
version = "0.1.0"
license = "PolyForm-Noncommercial-1.0.0 OR LicenseRef-Ombra-Commercial"
license-files = ["LICENSE"]
description = "LlamaIndex vector store for Ombra, a vector database with homomorphic encryption"
requires-python = ">=3.11"
dependencies = ["ombra==0.1.0", "llama-index-core>=0.12,<0.15", "numpy>=1.26,<3"]

[project.optional-dependencies]
test = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["llama_index"]
