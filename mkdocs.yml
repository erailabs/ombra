# The public docs site. Pages are in docs/site/; the rest of docs/ is internal and not published.
# Build: mkdocs build --strict (CI, .github/workflows/docs.yml). Values from the code come from
# docs/macros.py; see docs/site/contributing-docs.md.
site_name: Ombra
site_description: An encrypted vector database. Vectors, queries and scores stay encrypted with homomorphic encryption.
repo_url: https://github.com/erailabs/ombra
docs_dir: docs/site
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}

plugins:
  - search
  - macros:
      module_name: docs/macros
      on_error_fail: true
      on_undefined: strict
  - mkdocstrings:
      handlers:
        python:
          paths: [client]
          options:
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            docstring_section_style: table
            members_order: source
            merge_init_into_class: true
            show_if_no_docstring: true
            show_root_heading: true

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

